name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/okfn-brasil/querido-diario-frontend

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-deployment:
    name: Bump image in querido-diario-deployment
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: bump-deployment
      cancel-in-progress: false

    steps:
      # Token do GitHub App da org (ADR-009 do querido-diario-deployment),
      # escopado só ao repositório de deployment.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.QD_APP_ID }}
          private-key: ${{ secrets.QD_APP_PRIVATE_KEY }}
          owner: okfn-brasil
          repositories: querido-diario-deployment

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: okfn-brasil/querido-diario-deployment
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # Mesmo formato da tag publicada pelo job build (type=sha,format=short).
      - name: Update frontend newTag
        id: bump
        env:
          FILE: k8s/overlays/production/kustomization.yaml
        run: |
          tag="${GITHUB_SHA::7}"
          awk -v tag="$tag" -v img="$IMAGE" '
            $0 ~ "name: " img "$" { found = 1; print; next }
            found && /newTag:/ { sub(/newTag:.*/, "newTag: \"" tag "\""); found = 0 }
            { print }
          ' "$FILE" > "$FILE.new"
          mv "$FILE.new" "$FILE"
          grep -q "newTag: \"$tag\"" "$FILE"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bump/frontend-prod
          base: main
          commit-message: "release: atualiza imagem do frontend para ${{ steps.bump.outputs.tag }} em produção"
          title: "release: atualiza imagem do frontend para ${{ steps.bump.outputs.tag }} em produção"
          body: |
            Bump automático de `${{ env.IMAGE }}` para `${{ steps.bump.outputs.tag }}`.

            Origem: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            Merge aciona o deploy em produção (ver ADR-009).
          delete-branch: true
